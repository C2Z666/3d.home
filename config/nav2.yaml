# DWB + open-loop smoother adapted from d1nav_safe; final yaw is supervised.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    frame_id: map
    topic_name: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /d1/localization/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    publish_zero_velocity: true
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.15
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      limit_vel_cmd_in_traj: false
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      discretize_by_time: true
      time_granularity: 0.1
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      prune_plan: true
      prune_distance: 1.0
      forward_prune_distance: 2.0
      critics:
      - Oscillation
      - BaseObstacle
      - ObstacleFootprint
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.15
      BaseObstacle.scale: 0.05
      ObstacleFootprint.scale: 0.05
      PathDist.scale: 16.0
      GoalDist.scale: 24.0
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.2
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: nav_base
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: '[[0.49, 0.265], [-0.49, 0.265], [-0.49, -0.265], [0.49, -0.265]]'
      footprint_padding: 0.01
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /d1/nav/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: nav_odom
      robot_base_frame: nav_base
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      footprint: '[[0.49, 0.265], [-0.49, 0.265], [-0.49, -0.265], [0.49, -0.265]]'
      footprint_padding: 0.01
      resolution: 0.05
      rolling_window: true
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      width: 4
      height: 4
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /d1/nav/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: nav_base
    odom_topic: /d1/localization/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_rate_controller_bt_node
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.15
    - 0.0
    - 0.4
    min_velocity:
    - 0.0
    - 0.0
    - -0.4
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.3
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    enable_stamped_cmd_vel: false
    odom_topic: /d1/localization/odom
