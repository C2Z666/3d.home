map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    frame_id: map
    topic_name: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    odom_topic: /d1/localization/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.1
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.2
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.3
      max_angular_accel: 0.4
      allow_reversing: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: nav_base
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: '[[0.49, 0.265], [-0.49, 0.265], [-0.49, -0.265], [0.49, -0.265]]'
      footprint_padding: 0.01
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /d1/nav/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: nav_odom
      robot_base_frame: nav_base
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: '[[0.49, 0.265], [-0.49, 0.265], [-0.49, -0.265], [0.49, -0.265]]'
      footprint_padding: 0.01
      resolution: 0.05
      rolling_window: true
      track_unknown_space: false
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      width: 4
      height: 4
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /d1/nav/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 5.0
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: nav_base
    odom_topic: /d1/localization/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_rate_controller_bt_node
